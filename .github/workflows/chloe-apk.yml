name: Build Chloe Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Chloe/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/chloe-apk.yml"
  push:
    branches: [ main ]
    paths:
      - "Chloe/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/chloe-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Test and build Chloe
        run: gradle --no-daemon :Chloe:app:testDebugUnitTest :Chloe:app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Chloe-debug-apk
          path: Chloe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
